apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The default install lands the ServiceAccount in `kubeport-system`. The
# kustomize `namespace:` directive scopes namespaced resources only — the
# two ClusterRoles and ClusterRoleBindings ignore it (they are cluster-
# scoped). Operators relocating Kubeport to a different namespace should
# also patch the `subjects[].namespace` of clusterrolebinding.yaml.
namespace: kubeport-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml

commonLabels:
  app.kubernetes.io/name: kubeport
  app.kubernetes.io/component: control-plane
