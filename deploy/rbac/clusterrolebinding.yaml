# Default binding shape: both ClusterRoles bound cluster-wide so a single
# kubectl apply yields a working in-cluster Kubeport bench. Operators who
# want per-namespace least privilege should drop the second binding and
# replace it with one RoleBinding per workload namespace; see
# deploy/rbac/README.md §Tightening to per-namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeport:cluster-scoped
  labels:
    app.kubernetes.io/name: kubeport
    app.kubernetes.io/component: control-plane
subjects:
  - kind: ServiceAccount
    name: kubeport
    namespace: kubeport-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeport:cluster-scoped
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeport:namespaced
  labels:
    app.kubernetes.io/name: kubeport
    app.kubernetes.io/component: control-plane
subjects:
  - kind: ServiceAccount
    name: kubeport
    namespace: kubeport-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeport:namespaced
